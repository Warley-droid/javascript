<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>Sistema de Multas</h1>
    
    Velocidade do carro: <input type="number" name="txtvel" id="txtvel">km/h

    <input type="button" value="Verificar"  name="enviar1" id="enviar1">

    <div id="res"></div>
</body>

<script>
    const txtvel = window.document.querySelector('input#txtvel')

    const enviar1 = window.document.querySelector('input#enviar1')

    const res = window.document.querySelector('div#res')

    enviar1.addEventListener('click', calcular)

    function calcular(){
        const vel = Number(txtvel.value)

        res.innerHTML = `<p>Sua velocidade atual é de <strong>${vel}km/h</strong></p>`

        if (vel > 80){
            res.innerHTML += (`Você está <strong>MULTADO</strong> por exesso de velocidade`)
        }else{
            res.innerHTML += (`Você está por dentro da velocidade máxima permitida, continue assim!`)
        }

        res.innerHTML += `<p>Dirija sempre com o cinto de segurança!</p>`
    }
</script>
</html>
