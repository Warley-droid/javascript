<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste 05</title>
</head>
<body>
    <input type="number" name="txtn1" id="txtn1" placeholder="Sua pontuação:">

    <input type="number" name="txtn2" id="txtn2" placeholder="Pontuação adversária:">

    <input type="button" id="env1" name="env1" value="Resultado">

    <div id="res"></div>
</body>

<script>
    const txtn1 = window.document.querySelector('input#txtn1')

    const txtn2 = window.document.querySelector('input#txtn2')

    const env1 = window.document.querySelector('input#env1')
    env1.addEventListener('click', enviar)

    const res = window.document.querySelector('div#res')

    function enviar(){
        const n1 = Number(txtn1.value)
        const n2 = Number(txtn2.value)
        const s1 = n1+n2

        if (n1 > n2){
            res.innerHTML = `<p>Parabéns! Você venceu o jogo por <strong>${n1}</strong> a <strong>${n2}</strong></p>`
            }else{
                if (n1 == n2){
                    res.innerHTML = `<p>O jogo terminou empatado por <strong>${n1}</strong> a <strong>${n2}</strong></p>`
                }else{
                    if (n1 < n2){
                    res.innerHTML = `<p>Infelismente você perdeu o jogo por <strong>${n1}</strong> a <strong>${n2}</strong></p>`
                    }
                }
            }
        }
</script>
</html>
