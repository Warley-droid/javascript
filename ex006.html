<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        div#area{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20pt;
            font-weight: normal;
            background-color: green;
            color: white;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="area">

        Interaja...

    </div>

    <script>
            var a = window.document.querySelector('div#area') 

            a.addEventListener('click', clicar)
            a.addEventListener('mouseenter', entrar)
            a.addEventListener('mouseout', sair)

        function entrar() {
            a.innerText = 'Agora clique'
            a.style.background = 'red'
        }

        function clicar() {
            a.innerText = 'Você clicou!'
        }

        function sair(){
            a.innerText = 'Você saiu'
            a.style.background = 'green'
        }
    </script>
</body>
</html>
